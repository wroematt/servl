# ─────────────────────────────────────────────
#  Servl — Docker Compose (Raspberry Pi)
#  All services run on a single Pi 4 (4 GB).
#  For cloud migration: each service can be
#  extracted to its own compose file or k8s pod.
# ─────────────────────────────────────────────

networks:
  internal:          # private — services talk here
    driver: bridge
  public:            # nginx faces outward here
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  media_uploads:      # pet photos stored locally
  user_media_uploads: # user profile photos stored locally

services:

  # ── WEBSITE (Next.js dashboard) ────────────
  website:
    image: wroematt/servl-website:latest
    build:
      context: .
      dockerfile: website/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.servl.uk
    container_name: pf_website
    restart: unless-stopped
    ports:
      - "3006:3006"
    networks:
      - internal
    depends_on:
      - api-gateway

  # ── API GATEWAY ────────────────────────────
  api-gateway:
    image: wroematt/servl-api-gateway:latest
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: pf_api_gateway
    restart: unless-stopped
    ports:
      - "3000:3000"    # exposed for local development — remove in production (nginx handles routing)
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - USER_SERVICE_URL=http://user-service:3001
      - PET_SERVICE_URL=http://pet-service:3002
      - DEVICE_SERVICE_URL=http://device-service:3003
      - NOTIFICATION_SERVICE_URL=http://notification-service:3004
      - FEED_SERVICE_URL=http://feed-service:3005
      - CORS_ORIGIN=https://app.servl.uk
    networks:
      - internal
    depends_on:
      - user-service
      - pet-service
      - device-service
      - notification-service
      - feed-service

  # ── USER & AUTH SERVICE ────────────────────
  user-service:
    image: wroematt/servl-user-service:latest
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: pf_user_service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=15m
      - REFRESH_TOKEN_EXPIRES_IN=30d
      - DOMAIN=${DOMAIN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - INVITE_TOKEN_TTL=86400
      - RESET_TOKEN_TTL=3600
      - USER_MEDIA_UPLOAD_PATH=/user-uploads
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    volumes:
      - user_media_uploads:/user-uploads
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── PET & FEED HISTORY SERVICE ─────────────
  pet-service:
    image: wroematt/servl-pet-service:latest
    build:
      context: .
      dockerfile: services/pet-service/Dockerfile
    container_name: pf_pet_service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - MEDIA_UPLOAD_PATH=/uploads
    volumes:
      - media_uploads:/uploads
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  # ── DEVICE SERVICE ─────────────────────────
  device-service:
    image: wroematt/servl-device-service:latest
    build:
      context: .
      dockerfile: services/device-service/Dockerfile
    container_name: pf_device_service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3003
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - MQTT_INTERNAL_USER=${MQTT_INTERNAL_USER}
      - MQTT_INTERNAL_PASS=${MQTT_INTERNAL_PASS}
      - NOTIFICATION_SERVICE_URL=http://notification-service:3004
      # LAN URL that ESP32 devices can reach for OTA firmware downloads.
      # Set this to http://<raspberry-pi-lan-ip>:3000 in your .env file.
      - OTA_BASE_URL=${OTA_BASE_URL:-http://localhost:3000}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  # ── FEED SERVICE ───────────────────────────
  feed-service:
    image: wroematt/servl-feed-service:latest
    build:
      context: .
      dockerfile: services/feed-service/Dockerfile
    container_name: pf_feed_service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - DEVICE_SERVICE_URL=http://device-service:3003
      - GOOGLE_HOME_HMAC_SECRET=${GOOGLE_HOME_HMAC_SECRET}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      device-service:
        condition: service_started

  # ── NOTIFICATION SERVICE ───────────────────
  notification-service:
    image: wroematt/servl-notification-service:latest
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: pf_notification_service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3004
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - FCM_PROJECT_ID=${FCM_PROJECT_ID}
      - FCM_PRIVATE_KEY=${FCM_PRIVATE_KEY}
      - FCM_CLIENT_EMAIL=${FCM_CLIENT_EMAIL}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  # ── SCHEDULE WORKER ────────────────────────
  worker:
    image: wroematt/servl-worker:latest
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: pf_worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - FEED_SERVICE_URL=http://feed-service:3005
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      feed-service:
        condition: service_started

  # ── MQTT BROKER (Mosquitto) ─────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: pf_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"    # ESP32 devices on the LAN connect here (prototype: no TLS)
      - "8883:8883"    # reserved for TLS device listener when certs are ready
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/passwd:/mosquitto/config/passwd
      - ./mosquitto/config/acl:/mosquitto/config/acl:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - internal

  # ── POSTGRESQL ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pf_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── REDIS ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pf_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
