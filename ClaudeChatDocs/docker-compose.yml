version: "3.9"

# ─────────────────────────────────────────────
#  PetFeeder — Docker Compose (Raspberry Pi)
#  All services run on a single Pi 4 (4 GB).
#  For cloud migration: each service can be
#  extracted to its own compose file or k8s pod.
# ─────────────────────────────────────────────

networks:
  internal:          # private — services talk here
    driver: bridge
  public:            # nginx faces outward here
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  media_uploads:     # pet photos stored locally

services:

  # ── REVERSE PROXY ──────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: pf_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - public
      - internal
    depends_on:
      - api-gateway
      - website

  # ── WEBSITE (Next.js) ──────────────────────
  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: pf_website
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://${DOMAIN}/api
    networks:
      - internal
    depends_on:
      - api-gateway

  # ── API GATEWAY ────────────────────────────
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: pf_api_gateway
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=15m
      - REFRESH_TOKEN_EXPIRES_IN=30d
      - REDIS_URL=redis://redis:6379
      - USER_SERVICE_URL=http://user-service:3001
      - PET_SERVICE_URL=http://pet-service:3002
      - DEVICE_SERVICE_URL=http://device-service:3003
      - NOTIFICATION_SERVICE_URL=http://notification-service:3004
      - FEED_SERVICE_URL=http://feed-service:3005
    networks:
      - internal
    depends_on:
      - redis
      - user-service
      - pet-service
      - device-service
      - notification-service
      - feed-service

  # ── USER & AUTH SERVICE ────────────────────
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: pf_user_service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - INVITE_TOKEN_TTL=86400        # 24 hours in seconds
      - RESET_TOKEN_TTL=3600          # 1 hour in seconds
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── PET & FEED HISTORY SERVICE ─────────────
  pet-service:
    build:
      context: ./services/pet-service
      dockerfile: Dockerfile
    container_name: pf_pet_service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - MEDIA_UPLOAD_PATH=/uploads
    volumes:
      - media_uploads:/uploads
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  # ── DEVICE SERVICE ─────────────────────────
  device-service:
    build:
      context: ./services/device-service
      dockerfile: Dockerfile
    container_name: pf_device_service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3003
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - MQTT_INTERNAL_USER=${MQTT_INTERNAL_USER}
      - MQTT_INTERNAL_PASS=${MQTT_INTERNAL_PASS}
      - MQTT_CERTS_PATH=/mosquitto/certs
    volumes:
      - ./mosquitto/certs:/mosquitto/certs:ro
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  # ── FEED SERVICE ───────────────────────────
  feed-service:
    build:
      context: ./services/feed-service
      dockerfile: Dockerfile
    container_name: pf_feed_service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - MQTT_INTERNAL_USER=${MQTT_INTERNAL_USER}
      - MQTT_INTERNAL_PASS=${MQTT_INTERNAL_PASS}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      redis:
        condition: service_healthy

  # ── NOTIFICATION SERVICE ───────────────────
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: pf_notification_service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3004
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - FCM_PROJECT_ID=${FCM_PROJECT_ID}
      - FCM_PRIVATE_KEY=${FCM_PRIVATE_KEY}
      - FCM_CLIENT_EMAIL=${FCM_CLIENT_EMAIL}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── SCHEDULE WORKER ────────────────────────
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: pf_worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - FEED_SERVICE_URL=http://feed-service:3005
      - NOTIFICATION_SERVICE_URL=http://notification-service:3004
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      feed-service:
        condition: service_started

  # ── MQTT BROKER (Mosquitto) ─────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: pf_mosquitto
    restart: unless-stopped
    ports:
      - "8883:8883"    # TLS — devices connect here from LAN
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - internal

  # ── POSTGRESQL ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pf_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── REDIS ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pf_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
