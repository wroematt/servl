# ─────────────────────────────────────────────
#  Mosquitto MQTT broker config
#  Port 1883 — internal services (no TLS, LAN only)
#  Port 8883 — devices (TLS + certificate auth)
# ─────────────────────────────────────────────

# Internal listener — services on the Docker network
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd

# External listener — ESP32 devices (TLS + client certs)
listener 8883 0.0.0.0
allow_anonymous false

# TLS settings
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key

# Require client certificates for device auth
require_certificate true
use_subject_as_username true

# Topic ACL — enforced per client
acl_file /mosquitto/config/acl

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
