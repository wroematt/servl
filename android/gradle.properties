# AndroidX — required for all modern Android libraries
android.useAndroidX=true

# Disable AGP 9.x built-in Kotlin so that the standalone kotlin-android plugin
# registers the 'kotlin' extension. This also keeps Android BaseExtension
# available, which the Hilt Gradle plugin requires.
android.builtInKotlin=false

# Non-transitive R classes — recommended for build performance
android.nonTransitiveRClass=true

# JVM heap for Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Disable VFS file-system watching — prevents Windows file-lock issues during clean/build
org.gradle.vfs.watch=false

# Kotlin code style
kotlin.code.style=official
